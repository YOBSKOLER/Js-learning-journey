<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form id="calForm" action="" method="">
      <label for="number1">Number A</label>
      <input id="number1" type="number" name="number1" placeholder="enter a number" /> <br>
      <label for="number2">Number B</label>
      <input id="number2" type="number" name="number2" placeholder="enter a number" />
      <br />
      OPERATORS :
      
      <input type="radio" id="mul" name="operation" value="*">multiplication</input>
      <input type="radio" id="add" name="operation" value="+">addition</input>
      <input type="radio" id="sub" name="operation" value="-">subtraction</input>
      <input type="radio" id="div" name="operation" value="/">Division</input>
      <input type="radio" id="mod" name="operation" value="%">modulo</input><br>

      <button type="submit">Calculate</button>
      <hr />
     
    </form>
    <p>RESULT : <span id="result"></span></p>

    <script src="script.js"></script>
  </body>
</html>
